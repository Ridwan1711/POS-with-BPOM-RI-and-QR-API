[package]
name = "pos-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Rust API for the POS with BPOM RI and QR product identification"

[lib]
name = "pos_backend"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
dotenvy = "0.15"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "json", "query", "rustls"] }

[profile.release]
lto = "thin"
codegen-units = 4
